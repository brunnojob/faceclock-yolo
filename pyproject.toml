[project]
name = "faceclock-yolo"
version = "1.0.0"
description = "Privacy-first employee attendance verification with YOLO and encrypted face embeddings"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40",
  "pydantic-settings==2.9.1",
  "python-multipart==0.0.20",
  "cryptography==44.0.2",
  "numpy==2.1.3",
  "opencv-python-headless==4.11.0.86",
  "onnxruntime==1.21.1",
  "ultralytics==8.3.111",
  "slowapi==0.1.9"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

